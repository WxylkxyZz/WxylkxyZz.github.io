# Hexo Configuration
## Docs: https://hexo.io/docs/configuration
## Source: https://github.com/hexojs/hexo

# Site
title: Keep Throb
subtitle: ''
description: ''
keywords: ''
author: WxylkxyZz
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://<your-user-name>.github.io/project'
url: https://wxylkxyzz.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults: {}
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map: {}
tag_map: {}

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
theme: keep

# Deployment
deploy:
  type: git
  repo: https://github.com/WxylkxyZz/WxylkxyZz.github.io.git
  branch: master

# Search (hexo-generator-search)
search:
  path: search.json
  field: post
  content: true
  format: html

# MathJax (hexo-filter-mathjax)
# Renders $...$ math in posts; appends the MathJax CSS to post pages.
# Defaults: append_css true, every_page false (only pages with math get processing)
mathjax:
  enable: true
  tags: none
  single_dollars: true
  cjk_width: 0.9
  normal_width: 0.6
  append_css: true
  every_page: false
