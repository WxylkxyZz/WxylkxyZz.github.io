# Hexo Theme Keep configuration
# Recovered from the deployed site's embedded theme config (Keep 4.1.3)
# Docs: https://keep-docs.xpoet.cn

base_info:
  primary_color: "#99CC66"
  title: Keep Throb
  author: WxylkxyZz
  avatar: https://cdn.statically.io/gh/CoisiniZz/images@main/flows/head.2rn5pc5z7u20.webp
  logo: https://cdn.statically.io/gh/CoisiniZz/images@main/flows/image.2yni2qpf428.webp
  favicon: https://cdn.statically.io/gh/CoisiniZz/images@main/flows/image.2yni2qpf428.webp

menu:
  home: / || fa-solid fa-house
  archives: /archives || fa-solid fa-box-archive
  about: /about || fa-solid fa-people-pulling

first_screen:
  enable: true
  background_img: https://cdn.statically.io/gh/CoisiniZz/images@main/flows/bg.2qj30lgpdqo0.svg
  background_img_dark: https://cdn.statically.io/gh/CoisiniZz/images@main/flows/bg.2qj30lgpdqo0.svg
  description: "一片树林里分出两条路 || 而我选择了人迹更少的一条，从此决定了我一生的道路"
  hitokoto: false

social_contact:
  enable: true
  links:
    github: https://github.com/WxylkxyZz
    telegram: https://t.me/VelproMe
    email: VelproMe@gmail.com

scroll:
  progress_bar: true
  percent: true
  hide_header: false

home:
  announcement: "却顾所来径 苍苍横翠微"
  category: true
  tag: true
  post_datetime: "updated || fa-solid fa-hourglass-half"

post:
  author_badge:
    enable: true
    level_badge: false
    custom_badge:
      - 菜鸡
  word_count:
    wordcount: true
    min2read: true
  datetime_format: "YYYY-MM-DD HH:mm:ss"
  copyright_info: true
  share: true
  reward:
    enable: false
  created_datetime_icon: fa-solid fa-pen-to-square
  updated_datetime_icon: fa-solid fa-arrows-rotate

code_block:
  tools:
    enable: true
    style: mac
  highlight_theme: obsidian

toc:
  enable: true
  number: true
  expand_all: true
  init_open: true
  layout: right

website_count:
  busuanzi_count:
    enable: true
    site_uv: true
    site_pv: true
    page_pv: true

local_search:
  enable: true
  preload: true

comment:
  enable: false

rss:
  enable: false

lazyload:
  enable: true

cdn:
  enable: true
  provider: jsdelivr

pjax:
  enable: true

footer:
  since: 2020
  word_count: true
  site_deploy:
    enable: true
    provider: github
    url: https://github.com/WxylkxyZz
  record:
    enable: false

inject:
  enable: true
  css:
    - /css/custom-1.css
  js:
    - /js/custom-1.js
